<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>กล่องขวัญจดหมายระเบิด</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;overflow:hidden;touch-action:none;
    font-family:"Trebuchet MS","Sarabun",sans-serif;
    background:radial-gradient(circle at 50% 40%,#3b2a5e,#150f28 70%);
    display:grid;place-items:center;
  }
  /* ---------- ปุ่มหน้าแรกมุมซ้ายบน ---------- */
  #homeBtn{position:fixed;left:24px;top:24px;z-index:40;display:none;
    padding:10px 20px;border:0;border-radius:999px;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:700;color:#7a1038;
    background:linear-gradient(180deg,#fff2b8,#ffd24d);
    box-shadow:0 6px 20px rgba(0,0,0,.4);transition:transform .12s}
  #homeBtn:hover{transform:translateY(-2px)}
  #homeBtn.show{display:block;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}


  /* ---------- เวทีกลางจอ ---------- */
  .stage{position:relative;display:grid;place-items:center;gap:40px;z-index:2}
  .stage.gone{animation:stageOut .5s forwards}
  @keyframes stageOut{to{opacity:0;transform:scale(.6);visibility:hidden}}

  /* ---------- กล่องของขวัญ ---------- */
  .box{position:relative;width:180px;height:160px;animation:tremble .18s infinite}
  @keyframes tremble{
    0%,100%{transform:translate(0,0) rotate(0)}
    25%{transform:translate(-3px,2px) rotate(-2deg) scale(1.02)}
    50%{transform:translate(3px,-2px) rotate(2deg) scale(.99)}
    75%{transform:translate(-2px,-3px) rotate(1deg) scale(1.03)}
  }
  .base{position:absolute;bottom:0;width:180px;height:120px;
    background:linear-gradient(160deg,#ff5f8f,#d92b63);border-radius:8px;
    box-shadow:inset 0 -18px 30px rgba(0,0,0,.25),0 18px 40px rgba(255,60,120,.35)}
  .lid{position:absolute;top:0;left:-10px;width:200px;height:48px;
    background:linear-gradient(160deg,#ff86ab,#e8356f);border-radius:8px;
    box-shadow:0 6px 0 rgba(0,0,0,.15);transform-origin:50% 100%;z-index:3}
  .ribbon-v,.ribbon-h{position:absolute;left:50%;top:0;width:26px;height:100%;
    margin-left:-13px;background:#ffe27a}
  .bow{position:absolute;top:-22px;left:50%;width:56px;height:34px;margin-left:-28px;
    background:#ffe27a;border-radius:50% 50% 40% 40%;z-index:4;
    box-shadow:-26px 4px 0 -6px #ffd24d,26px 4px 0 -6px #ffd24d}
  .glow{position:absolute;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,#fff6c9,transparent 65%);
    filter:blur(12px);animation:pulse .5s infinite alternate}
  @keyframes pulse{from{opacity:.25;transform:scale(.8)}to{opacity:.8;transform:scale(1.15)}}

  /* ---------- ปุ่ม ---------- */
  .btn{padding:16px 38px;border:0;border-radius:999px;cursor:pointer;
    font-size:18px;font-weight:700;font-family:inherit;color:#7a1038;
    background:linear-gradient(180deg,#fff2b8,#ffd24d);
    box-shadow:0 8px 0 #c79a12,0 14px 30px rgba(0,0,0,.35);
    transition:transform .12s,box-shadow .12s}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(6px);box-shadow:0 2px 0 #c79a12}

  /* ---------- เอฟเฟกต์ระเบิด ---------- */
  .shock{position:fixed;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;
    border:6px solid #fff;border-radius:50%;opacity:0;pointer-events:none;z-index:5}
  .shock.go{animation:shock .8s ease-out forwards}
  @keyframes shock{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(28)}}
  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
  .flash.go{animation:flash .5s ease-out}
  @keyframes flash{0%{opacity:.95}100%{opacity:0}}
  .ring{position:fixed;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;
    border:5px solid #ffd24d;pointer-events:none;z-index:22;
    animation:ringOut .9s ease-out forwards}
  @keyframes ringOut{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(22)}}

  /* ---------- จดหมาย ---------- */
  #layer{position:fixed;inset:0;pointer-events:none;z-index:4}
  .letter{position:absolute;left:0;top:0;width:78px;height:54px;
    background:linear-gradient(180deg,#fffdf5,#f3e6c8);
    border-radius:6px;box-shadow:0 8px 18px rgba(0,0,0,.35);
    pointer-events:auto;cursor:grab;will-change:transform;user-select:none}
  .letter::before{content:"";position:absolute;inset:0;
    border-top:27px solid #ffd9e3;border-left:39px solid transparent;
    border-right:39px solid transparent;border-radius:6px 6px 0 0}
  .letter::after{content:"♥";position:absolute;left:50%;top:44%;
    transform:translate(-50%,-50%);color:#e8356f;font-size:20px}
  .letter.settled{transition:transform 1.1s cubic-bezier(.16,1,.3,1)}
  .letter.settled:hover{filter:brightness(1.12)}
  .letter.dragging{cursor:grabbing;transition:none!important;
    box-shadow:0 22px 40px rgba(0,0,0,.55);filter:brightness(1.15)}
  .letter.fly{transition:transform .75s cubic-bezier(.5,-.3,.6,1),opacity .75s ease-in}
  .letter.glowing{box-shadow:0 0 22px rgba(255,180,210,.85),0 10px 24px rgba(0,0,0,.4)}
  .letter.wall{animation:wallHit .25s ease-out}
  @keyframes wallHit{0%{filter:brightness(1.7) saturate(1.3)}100%{filter:brightness(1)}}

  /* ---------- ป๊อปอัพอ่านจดหมาย ---------- */
  #modal{position:fixed;inset:0;display:none;place-items:center;z-index:30;
    background:rgba(10,6,20,.6);backdrop-filter:blur(4px)}
  #modal.show{display:grid}
  .paper{max-width:420px;margin:20px;padding:36px 32px;border-radius:14px;text-align:center;
    background:linear-gradient(180deg,#fffdf5,#f6ead0);
    box-shadow:0 30px 60px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.7);opacity:0}}
  .paper p{font-size:20px;line-height:1.7;color:#5a3b2e}
  .paper small{display:block;margin-top:18px;color:#a08b74}

  /* ---------- กล่องความทรงจำมุมขวาล่าง ---------- */
  #tray{position:fixed;right:24px;bottom:24px;width:96px;height:78px;z-index:20;
    cursor:pointer;opacity:0;transform:translateY(30px);pointer-events:none;
    transition:opacity .4s,transform .4s}
  #tray.on{opacity:1;transform:translateY(0);pointer-events:auto}
  #tray .tbody{position:absolute;bottom:0;width:96px;height:58px;border-radius:8px;
    background:linear-gradient(160deg,#ff5f8f,#c9245a);
    box-shadow:0 12px 28px rgba(0,0,0,.45),inset 0 -10px 18px rgba(0,0,0,.25)}
  #tray .tlip{position:absolute;bottom:50px;left:-5px;width:106px;height:16px;
    border-radius:6px;background:linear-gradient(160deg,#ff9cbb,#e8356f)}
  #tray .tlabel{position:absolute;bottom:12px;width:100%;text-align:center;
    color:#fff;font-size:12px;letter-spacing:.5px;opacity:.9}
  #tray:hover{transform:translateY(-4px)}
  #tray.bump{animation:bump .45s cubic-bezier(.2,1.6,.4,1)}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22) rotate(-4deg)}100%{transform:scale(1)}}
  #tray.blow{animation:blow .55s ease-out forwards}
  @keyframes blow{
    0%{transform:scale(1)}
    25%{transform:scale(1.45) rotate(7deg);filter:brightness(2)}
    100%{transform:scale(0) rotate(-45deg);opacity:0}
  }
  #badge{position:absolute;top:-6px;right:-8px;min-width:28px;height:28px;padding:0 7px;
    border-radius:999px;background:#ffd24d;color:#7a1038;font-weight:800;font-size:14px;
    display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.4)}

  /* ---------- แผงอ่านย้อนหลัง ---------- */
  #panel{position:fixed;right:24px;bottom:118px;width:320px;max-height:60vh;z-index:25;
    display:none;flex-direction:column;border-radius:14px;overflow:hidden;
    background:rgba(28,18,48,.96);backdrop-filter:blur(8px);
    box-shadow:0 24px 60px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1)}
  #panel.show{display:flex;animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
  #panel h3{padding:14px 16px;color:#ffd24d;font-size:15px;
    border-bottom:1px solid rgba(255,255,255,.12)}
  #list{overflow-y:auto;padding:8px}
  #list .item{padding:12px 14px;margin:6px 0;border-radius:10px;cursor:pointer;
    color:#f0e6ff;font-size:14px;line-height:1.5;background:rgba(255,255,255,.06);
    border-left:3px solid #e8356f;transition:background .18s,transform .18s;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #list .item:hover{background:rgba(255,255,255,.14);transform:translateX(3px)}
  #list .empty{padding:22px;text-align:center;color:#9a8fb5;font-size:14px}
  @media(max-width:480px){#panel{width:calc(100vw - 48px)}}

  /* ---------- หัวใจลอยเป็นฉากหลัง ---------- */
  #amb{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  .hb{position:absolute;bottom:-40px;color:#ff8ab0;opacity:0;
    animation:floatUp linear forwards;will-change:transform}
  @keyframes floatUp{
    0%{opacity:0;transform:translateY(0) scale(.6) rotate(0)}
    15%{opacity:.55}
    85%{opacity:.35}
    100%{opacity:0;transform:translateY(-110vh) scale(1.1) rotate(40deg)}
  }

  /* ---------- ฉากจบ ---------- */
  #finale{position:fixed;inset:0;z-index:28;display:none;
    place-items:center;text-align:center;padding:24px}
  #finale.show{display:grid;animation:fadeIn .6s}
  @keyframes fadeIn{from{opacity:0}}
  #finale .fin-in{animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
  #finale h1{font-size:clamp(28px,6vw,52px);color:#ffd24d;margin-bottom:14px;
    text-shadow:0 0 30px rgba(255,140,180,.6)}
  #finale p{color:#f0e6ff;font-size:clamp(15px,3.4vw,19px);line-height:1.8;
    max-width:540px;margin:0 auto 30px}
  #finale .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .btn2{padding:13px 26px;border:0;border-radius:999px;cursor:pointer;
    font-size:15px;font-weight:700;font-family:inherit;
    background:linear-gradient(180deg,#fff2b8,#ffd24d);color:#7a1038;
    box-shadow:0 6px 0 #c79a12,0 12px 26px rgba(0,0,0,.35);
    transition:transform .12s,box-shadow .12s}
  .btn2.ghost{background:transparent;color:#ffd6e4;
    border:2px solid rgba(255,255,255,.35);box-shadow:none}
  .btn2:hover{transform:translateY(-2px)}
  .btn2:active{transform:translateY(4px);box-shadow:0 2px 0 #c79a12}

  /* ---------- รูปตรงกลางหัวใจ ---------- */
  #core{position:fixed;left:50%;top:50%;z-index:23;display:none;pointer-events:none}
  #core.show{display:block;animation:corePop .9s cubic-bezier(.2,1.5,.4,1) forwards}
  @keyframes corePop{
    0%{transform:translate(-50%,-50%) scale(0) rotate(-40deg);opacity:0}
    60%{opacity:1}
    100%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}
  }
  #core .wrap{animation:bob 3.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(-6px)}50%{transform:translateY(8px)}}
  #core img{display:block;width:min(30vw,210px);border-radius:26px;
    box-shadow:0 0 70px rgba(255,150,200,.75),0 20px 50px rgba(0,0,0,.5)}
  #core .fallback{width:min(30vw,210px);height:min(30vw,210px);border-radius:26px;
    display:grid;place-items:center;font-size:min(16vw,110px);color:#ff7fb0;
    background:radial-gradient(circle,#fff0f6,#ffc6da);
    box-shadow:0 0 70px rgba(255,150,200,.75)}
  #coreCap{position:absolute;left:50%;top:calc(100% + 14px);transform:translateX(-50%);
    white-space:nowrap;color:#ffd24d;font-size:15px;font-weight:700;
    text-shadow:0 2px 10px rgba(0,0,0,.6)}

  /* ---------- ปุ่มเก็บกลับ ---------- */
  #backBtn{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    z-index:26;display:none}
  #backBtn.show{display:block;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
</style>
</head>
<body>

    <button id="homeBtn">หน้าแรก</button>
<div id="amb"></div>

<div class="stage" id="stage">
  <div class="box" id="box">
    <div class="glow"></div>
    <div class="base"><div class="ribbon-v"></div></div>
    <div class="lid" id="lid"><div class="ribbon-h"></div></div>
    <div class="bow"></div>
  </div>
  <button class="btn" id="openBtn">กดเลย… มันจะระเบิดแล้ว</button>
</div>

<div class="shock" id="shock"></div>
<div class="flash" id="flash"></div>
<div id="layer"></div>

<div id="tray" title="กล่องความทรงจำ">
  <div class="tbody"></div>
  <div class="tlip"></div>
  <div class="tlabel">ความทรงจำ</div>
  <div id="badge">0</div>
</div>

<div id="panel">
  <h3>จดหมายในกล่องความทรงจำ</h3>
  <div id="list"><div class="empty">ยังไม่มีจดหมายในกล่อง</div></div>
</div>

<div id="modal"><div class="paper">
  <p id="msg"></p><small id="hint">(คลิกที่ไหนก็ได้เพื่อปิด)</small>
</div></div>

<div id="core">
  <div class="wrap" id="coreWrap"></div>
  <div id="coreCap">ความทรงจำทั้งหมดของเรา</div>
</div>

<button class="btn2 ghost" id="backBtn">เก็บจดหมายกลับเข้ากล่อง</button>

<div id="finale"><div class="fin-in">
  <h1>อ่านครบทุกฉบับแล้วนะ</h1>
  <p>จดหมายทั้งหมดเก็บไว้ในกล่องความทรงจำเรียบร้อยแล้วนะคะ<br>
     พี่ๆลองเทจดหมายออกมาดูสิขะ</p>
  <div class="row">
    <button class="btn2" id="againBtn">เทจดหมาย</button>
    <button class="btn2 ghost" id="readBtn">เปิดกล่องอ่านย้อนหลัง</button>
  </div>
</div></div>

<script>
const CENTER_IMG = "center.png";
const MESSAGES = [
  "สุขสันต์วันเกิดนะ ขอให้ปีนี้เป็นปีที่ดีที่สุด",
  "ขอบคุณที่อยู่ข้างกันเสมอนะ",
  "ยิ้มหน่อยสิ วันนี้เธอเก่งมากแล้ว",
  "คิดถึงนะ จริง ๆ",
  "ขอให้ทุกอย่างที่หวังไว้เป็นจริงทุกอย่าง",
  "เธอคือของขวัญที่ดีที่สุดของปีนี้",
  "เหนื่อยก็พักได้นะ เดี๋ยวเราคอยอยู่ตรงนี้",
  "โชคดีทุกวันเลยนะ",
  "ไม่ว่าจะเจออะไร เราเชื่อว่าเธอผ่านมันไปได้",
  "ขอบคุณที่เป็นเธอในแบบนี้"
];

const TOTAL = MESSAGES.length;
const HEART_N = Math.max(TOTAL, 20);

const box=document.getElementById('box'), lid=document.getElementById('lid');
const layer=document.getElementById('layer'), stage=document.getElementById('stage');
const modal=document.getElementById('modal'), msg=document.getElementById('msg'), hint=document.getElementById('hint');
const tray=document.getElementById('tray'), badge=document.getElementById('badge');
const panel=document.getElementById('panel'), list=document.getElementById('list');
const amb=document.getElementById('amb'), finale=document.getElementById('finale');
const core=document.getElementById('core'), coreWrap=document.getElementById('coreWrap');
const backBtn=document.getElementById('backBtn');

let opened=false, topZ=100, pending=null, ambTimer=null, heartMode=false;
let heartItems=[];
const archive=[];

badge.textContent='0/'+TOTAL;
document.getElementById('openBtn').addEventListener('click',blast);

/* ================= ปุ่มหน้าแรก (รีเซ็ตกลับไปเริ่มต้น) ================= */

homeBtn.addEventListener('click',()=>{

  if(confirm('ต้องการกลับไปหน้าเริ่มต้นใช่ไหม?')){

    location.reload(); // รีเฟรชหน้าเว็บกลับสู่ค่าเริ่มต้นทั้งหมดทันทีแบบสะอาด

  }

});

/* ================= ขอบจอ ================= */
function bounds(o){
  const m = Math.max(39,27) * o.sc * .92;
  return {minX:m, maxX:innerWidth-m, minY:m, maxY:innerHeight-m};
}

function clampPos(o){
  const b=bounds(o); let hit=false;
  if(o.x<b.minX){o.x=b.minX; hit=true}
  if(o.x>b.maxX){o.x=b.maxX; hit=true}
  if(o.y<b.minY){o.y=b.minY; hit=true}
  if(o.y>b.maxY){o.y=b.maxY; hit=true}
  return hit;
}

/* ================= ระเบิดกล่องหลัก ================= */
function blast(){
  if(opened) return; opened=true;
  document.getElementById('flash').classList.add('go');
  document.getElementById('shock').classList.add('go');

  lid.style.transition='transform 1s cubic-bezier(.2,.8,.3,1),opacity .9s';
  lid.style.transform='translate(-60px,-420px) rotate(-70deg)';
  lid.style.opacity='0';
  box.style.animation='none';

  const r=box.getBoundingClientRect();
  spawn(r.left+r.width/2, r.top+r.height/2, TOTAL);

  setTimeout(()=>stage.classList.add('gone'),450);
  setTimeout(()=>{
    tray.classList.add('on');
    homeBtn.classList.add('show'); // <-- เพิ่มบรรทัดนี้เพื่อให้ปุ่มหน้าแรกโผล่มาพร้อมกล่องความทรงจำ
  },1400);
  startAmbient();
}

/* ================= สร้าง + ยิงจดหมาย ================= */
function newLetter(x,y,text){
  const el=document.createElement('div');
  el.className='letter';
  const o={el,x,y,vx:0,vy:0,rot:0,vr:0,sc:1,text,held:false};
  el._o=o;
  makeDraggable(o);
  layer.appendChild(el);
  return o;
}

function spawn(cx,cy,n){
  const pool = MESSAGES.slice().sort(()=>Math.random()-0.5);
  const items=[];
  for(let i=0;i<n;i++){
    const o=newLetter(cx,cy,pool[i%pool.length]);
    const a=Math.random()*Math.PI*2, sp=11+Math.random()*16;
    o.vx=Math.cos(a)*sp; o.vy=Math.sin(a)*sp-11;
    o.rot=Math.random()*360; o.vr=(Math.random()-.5)*26;
    o.sc=.85+Math.random()*.45;
    items.push(o);
  }
  const t0=performance.now();
  (function loop(t){
    items.forEach(o=>{
      if(o.held) return;
      o.x+=o.vx; o.y+=o.vy; o.vy+=.45; o.vx*=.99; o.rot+=o.vr;

      const b=bounds(o);
      if(o.x<b.minX){o.x=b.minX; o.vx= Math.abs(o.vx)*.62; o.vr*=-.7}
      if(o.x>b.maxX){o.x=b.maxX; o.vx=-Math.abs(o.vx)*.62; o.vr*=-.7}
      if(o.y<b.minY){o.y=b.minY; o.vy= Math.abs(o.vy)*.62}
      if(o.y>b.maxY){o.y=b.maxY; o.vy=-Math.abs(o.vy)*.55; o.vx*=.88; o.vr*=.8}

      draw(o);
    });
    if(t-t0<850) requestAnimationFrame(loop); else settle(items);
  })(t0);
}

function draw(o){
  if(clampPos(o) && o.held){
    o.el.classList.remove('wall'); void o.el.offsetWidth; o.el.classList.add('wall');
  }
  o.el.style.transform=
    `translate(${o.x-39}px,${o.y-27}px) rotate(${o.rot}deg) scale(${o.sc})`;
}

function settle(items){
  const n=items.length;
  const cols=Math.ceil(Math.sqrt(n*(innerWidth/innerHeight)));
  const rows=Math.ceil(n/cols);
  const cw=(innerWidth-160)/cols, ch=(innerHeight-180)/rows;
  const slots=[...Array(n).keys()].sort(()=>Math.random()-0.5);

  items.forEach((o,i)=>{
    if(o.held) return;
    const s=slots[i], c=s%cols, r=Math.floor(s/cols);
    o.el.classList.add('settled');
    o.x = 80 + c*cw + cw/2 + (Math.random()-.5)*cw*.4;
    o.y = 90 + r*ch + ch/2 + (Math.random()-.5)*ch*.4;
    o.rot=(Math.random()-.5)*44;
    setTimeout(()=>draw(o), i*35);
  });
}

/* ================= ลากจดหมาย ================= */
function makeDraggable(o){
  const el=o.el;
  let sx=0, sy=0, ox=0, oy=0, moved=false;

  el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
    el.style.zIndex=++topZ;
    o.held=true; moved=false;
    sx=e.clientX; sy=e.clientY; ox=o.x; oy=o.y;
  });

  el.addEventListener('pointermove',e=>{
    if(!o.held) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)>5||Math.abs(dy)>5) moved=true;
    o.x=ox+dx; o.y=oy+dy; draw(o);
  });

  const end=()=>{
    if(!o.held) return;
    o.held=false; o.vx=0; o.vy=0; o.vr=0;
    el.classList.remove('dragging');
    el.classList.add('settled');
    if(!moved){
      if(heartMode) openArchive(o.text);
      else openLetter(o);
    }
  };
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
}

/* ================= อ่าน + เก็บลงกล่อง ================= */
function openLetter(o){
  msg.textContent=o.text;
  hint.textContent='(ปิดแล้วจดหมายจะถูกเก็บลงกล่องความทรงจำมุมขวาล่าง)';
  pending=o;
  modal.classList.add('show');
}

function openArchive(text){
  msg.textContent=text;
  hint.textContent='(คลิกที่ไหนก็ได้เพื่อปิด)';
  pending=null;
  modal.classList.add('show');
}

modal.addEventListener('click',()=>{
  modal.classList.remove('show');
  if(pending){ collect(pending); pending=null; }
});

function collect(o){
  const t=tray.getBoundingClientRect();
  const tx=t.left+t.width/2, ty=t.top+t.height/2;
  o.el.classList.remove('settled');
  o.el.classList.add('fly');
  o.el.style.zIndex=++topZ;
  o.el.style.transform=`translate(${tx-39}px,${ty-27}px) rotate(720deg) scale(.15)`;
  o.el.style.opacity='0';

  setTimeout(()=>{
    o.el.remove();
    archive.push({text:o.text, time:new Date()});
    badge.textContent=archive.length+'/'+TOTAL;
    tray.classList.remove('bump'); void tray.offsetWidth; tray.classList.add('bump');
    renderList();
    if(archive.length>=TOTAL) setTimeout(showFinale,600);
  },740);
}

/* ================= แผงอ่านย้อนหลัง ================= */
function renderList(){
  if(!archive.length){ list.innerHTML='<div class="empty">ยังไม่มีจดหมายในกล่อง</div>'; return; }
  list.innerHTML='';
  archive.slice().reverse().forEach(a=>{
    const d=document.createElement('div');
    d.className='item';
    d.textContent=a.time.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+'  ·  '+a.text;
    d.title=a.text;
    d.addEventListener('click',()=>openArchive(a.text));
    list.appendChild(d);
  });
}

tray.addEventListener('click',()=>{ if(!heartMode) panel.classList.toggle('show'); });
document.addEventListener('pointerdown',e=>{
  if(panel.classList.contains('show') && !panel.contains(e.target) && !tray.contains(e.target))
    panel.classList.remove('show');
});

/* ================= หัวใจลอยเป็นฉากหลัง ================= */
function startAmbient(){
  if(ambTimer) return;
  ambTimer=setInterval(()=>{
    const h=document.createElement('div');
    h.className='hb';
    h.textContent=Math.random()<.35?'✦':'♥';
    h.style.left=Math.random()*100+'vw';
    h.style.fontSize=(12+Math.random()*26)+'px';
    const dur=7+Math.random()*7;
    h.style.animationDuration=dur+'s';
    amb.appendChild(h);
    setTimeout(()=>h.remove(),dur*1000);
  },420);
}

function burstHearts(n){
  for(let i=0;i<n;i++) setTimeout(()=>{
    const h=document.createElement('div');
    h.className='hb'; h.textContent='♥';
    h.style.left=Math.random()*100+'vw';
    h.style.fontSize=(16+Math.random()*30)+'px';
    h.style.animationDuration=(5+Math.random()*4)+'s';
    amb.appendChild(h); setTimeout(()=>h.remove(),9000);
  },i*90);
}

/* ================= ฉากจบ ================= */
function showFinale(){
  finale.classList.add('show');
  burstHearts(26);
}
document.getElementById('readBtn').addEventListener('click',()=>{
  finale.classList.remove('show');
  panel.classList.add('show');
});
document.getElementById('againBtn').addEventListener('click',heartBurst);

/* ================= สูตรพิกัดหัวใจ ================= */
function heartPoints(n,cx,cy,s){
  const pts=[];
  for(let i=0;i<n;i++){
    const t=Math.PI/2 + (i/n)*Math.PI*2;
    const x=16*Math.pow(Math.sin(t),3);
    const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    pts.push({x:cx+x*s, y:cy-y*s});
  }
  return pts;
}

/* ================= เทจดหมาย → ระเบิดเป็นหัวใจ ================= */
function heartBurst(){
  if(heartMode) return;
  heartMode=true;
  finale.classList.remove('show');
  panel.classList.remove('show');

  const t=tray.getBoundingClientRect();
  const tx=t.left+t.width/2, ty=t.top+t.height/2;

  const ring=document.createElement('div');
  ring.className='ring'; ring.style.left=tx+'px'; ring.style.top=ty+'px';
  document.body.appendChild(ring);
  setTimeout(()=>ring.remove(),900);
  tray.classList.add('blow');
  setTimeout(()=>{ tray.classList.remove('on','blow'); },560);
  burstHearts(18);

  const s=Math.min(innerWidth/44, innerHeight/42);
  const pts=heartPoints(HEART_N, innerWidth/2, innerHeight/2, s);
  const texts=(archive.length?archive.map(a=>a.text):MESSAGES.slice());

  heartItems=[];
  for(let i=0;i<HEART_N;i++){
    const o=newLetter(tx,ty,texts[i%texts.length]);
    o.sc=.5; o.rot=Math.random()*360-180;
    draw(o);
    heartItems.push(o);

    const a=Math.random()*Math.PI*2, d=130+Math.random()*190;
    setTimeout(()=>{
      o.el.style.transition='transform .45s cubic-bezier(.2,.8,.3,1)';
      o.x=tx+Math.cos(a)*d; o.y=ty+Math.sin(a)*d-80;
      o.sc=1.05; draw(o);
    }, 60+i*18);

    setTimeout(()=>{
      if(o.held) return;
      o.el.style.transition='transform 1s cubic-bezier(.16,1,.3,1)';
      o.el.classList.add('glowing');
      o.x=pts[i].x; o.y=pts[i].y; o.sc=.78;
      o.rot=(Math.random()-.5)*26;
      draw(o);
      setTimeout(()=>o.el.classList.add('settled'),1000);
    }, 620+i*45);
  }

  setTimeout(showCore, 620+HEART_N*45+500);
  setTimeout(()=>backBtn.classList.add('show'), 620+HEART_N*45+1200);
}

function showCore(){

  const img=new Image();

  img.src="NTFFAM.jpg";

  img.onload=()=>{ coreWrap.innerHTML=''; coreWrap.appendChild(img); core.classList.add('show'); };

  img.onerror=()=>{ coreWrap.innerHTML='<div class="fallback">♥</div>'; core.classList.add('show'); };

  burstHearts(20);

}


/* ================= เก็บกลับเข้ากล่อง ================= */
backBtn.addEventListener('click',()=>{
  backBtn.classList.remove('show');
  core.classList.remove('show');
  tray.classList.add('on');

  const t=tray.getBoundingClientRect();
  const tx=t.left+t.width/2, ty=t.top+t.height/2;

  heartItems.forEach((o,i)=>setTimeout(()=>{
    o.el.classList.remove('settled','glowing');
    o.el.classList.add('fly');
    o.el.style.transform=`translate(${tx-39}px,${ty-27}px) rotate(720deg) scale(.12)`;
    o.el.style.opacity='0';
    setTimeout(()=>o.el.remove(),760);
  }, i*35));

  setTimeout(()=>{
    heartItems=[]; heartMode=false;
    tray.classList.remove('bump'); void tray.offsetWidth; tray.classList.add('bump');
    showFinale();
  }, HEART_N*35+900);
});

/* ย่อ/ขยายหน้าจอ แล้วดึงจดหมายกลับเข้าจออัตโนมัติ */
addEventListener('resize',()=>{
  document.querySelectorAll('.letter').forEach(el=>{
    const o=el._o; if(!o||o.held) return;
    el.classList.add('settled');
    draw(o);
  });
});
</script>
